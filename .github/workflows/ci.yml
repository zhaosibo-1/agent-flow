name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: 单元测试
        run: python -m pytest -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: 起服务
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8132 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8132/api/health && break
            sleep 1
          done
      - name: 端到端黑盒验收
        run: python scripts/e2e_check.py http://127.0.0.1:8132

  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 零依赖门禁
        run: python scripts/check_core_isolation.py

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -t agent-flow:ci .
      - name: 容器内健康检查
        run: |
          docker run -d --name af -p 8132:8132 agent-flow:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8132/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8132/api/health
          docker rm -f af
